name: ZeroRun frozen historical record replay
on:
  workflow_dispatch:
  push:
    branches: [research/q1q2-20261029]
    paths: [.github/workflows/zerorun-record-replay.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay all frozen records
        run: python3 -B research/q1q2/run_replay.py --output "$RUNNER_TEMP/q1q2-record-replay"
      - name: Preserve all dispositions and source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q1q2-record-replay
          retention-days: 90
          path: |
            ${{ runner.temp }}/q1q2-record-replay/summary.json
            ${{ runner.temp }}/q1q2-record-replay/host.jsonl
            ${{ runner.temp }}/q1q2-record-replay/*/summary.json
            ${{ runner.temp }}/q1q2-record-replay/*/*/record.json
            ${{ runner.temp }}/q1q2-record-replay/*/*/acquisition.json
            ${{ runner.temp }}/q1q2-record-replay/*/*/source.tar.gz
            ${{ runner.temp }}/q1q2-record-replay/*/*/oracle-full-stdout.txt
            ${{ runner.temp }}/q1q2-record-replay/runtime/completion.json
            ${{ runner.temp }}/q1q2-record-replay/runtime/commands/*.json
            ${{ runner.temp }}/q1q2-record-replay/runtime/context/**
