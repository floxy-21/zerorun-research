name: ZeroRun qualification and full-cost pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute exploratory pilot
        run: python3 -B research/q1q2/run_pilot.py "$RUNNER_TEMP/q1q2-pilot"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q1q2-cost-pilot
          path: |
            ${{ runner.temp }}/q1q2-pilot/report.json
            ${{ runner.temp }}/q1q2-pilot/host.jsonl
            ${{ runner.temp }}/q1q2-pilot/*/acquisition.json
            ${{ runner.temp }}/q1q2-pilot/*/preflight-*.json
            ${{ runner.temp }}/q1q2-pilot/*/block-*.json
            ${{ runner.temp }}/q1q2-pilot/*/source.tar.gz
            ${{ runner.temp }}/q1q2-pilot/*/oracle-full-stdout.txt
            ${{ runner.temp }}/q1q2-pilot/runtime/completion.json
            ${{ runner.temp }}/q1q2-pilot/runtime/commands/*.json
          retention-days: 90
