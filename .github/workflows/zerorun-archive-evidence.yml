name: Preserve verified research evidence
on:
  workflow_dispatch:
  push:
    branches: [research/q1q2-20261029]
    paths: [.github/workflows/zerorun-archive-evidence.yml, research/q1q2/ARTIFACTS.json]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/q1q2-20261029
      - name: Verify and retain exact artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B research/q1q2/archive_evidence.py
      - name: Commit retained evidence without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/q1q2/evidence
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Preserve verified experiment artifacts and per-file integrity manifests'
          git pull --rebase origin research/q1q2-20261029
          git push origin HEAD:research/q1q2-20261029
